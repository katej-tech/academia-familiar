<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Academia Familiar</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Academia%20Familiar%22%2C%22short_name%22%3A%22Academia%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22orientation%22%3A%22portrait%22%2C%22background_color%22%3A%22%235BC0F8%22%2C%22theme_color%22%3A%22%237C3AED%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520512%2520512%2522%253E%253Crect%2520width%253D%2522512%2522%2520height%253D%2522512%2522%2520rx%253D%252296%2522%2520fill%253D%2522%25237C3AED%2522%252F%253E%253Ctext%2520x%253D%2522256%2522%2520y%253D%2522350%2522%2520font-size%253D%2522260%2522%2520text-anchor%253D%2522middle%2522%253E%25F0%259F%258E%2593%253C%252Ftext%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%2C%22purpose%22%3A%22any%20maskable%22%7D%5D%7D">
<meta name="theme-color" content="#7C3AED">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Academia">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --kid-ink:#1E2A4A; --kid-yellow:#FFC93C; --kid-green:#3EC97C; --kid-blue:#3B82F6; --kid-red:#FF6B6B; --kid-purple:#A78BFA;
  --teen-bg:#0F0D1A; --teen-card:#1C1830; --teen-violet:#8B5CF6; --teen-pink:#EC4899; --teen-cyan:#22D3EE; --teen-ink:#F4F1FF; --teen-mut:#9D95BD;
  --par-bg:#F4F6FA; --par-ink:#1F2A44; --par-acc:#0E9488; --par-line:#E2E8F0; --par-mut:#5B6B85;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(17px,4.4vw,22px)}
body{font-family:'Nunito',sans-serif;background:var(--par-bg);color:var(--par-ink);min-height:100dvh;overflow-x:hidden}
#app{max-width:640px;margin:0 auto;min-height:100dvh;padding:max(12px,3vw) max(14px,4vw) 40px;position:relative}
button{font-family:inherit;cursor:pointer;border:none;font-size:1rem;color:inherit}
input{font-family:inherit;font-size:1rem}
.hidden{display:none!important}
.center{text-align:center}

/* ================= TEMA NIÑO: mundo de juego ================= */
body.kid{font-family:'Fredoka',sans-serif;color:var(--kid-ink);
  background:linear-gradient(180deg,#5BC0F8 0%,#8ED9F5 45%,#BDF0D8 100%);background-attachment:fixed}
body.kid .card{background:#FFFEF8;border:4px solid var(--kid-ink);border-radius:26px;box-shadow:0 8px 0 rgba(30,42,74,.85);padding:20px;margin-bottom:18px}
.kbtn{display:block;width:100%;min-height:68px;padding:16px 20px;border-radius:22px;border:4px solid var(--kid-ink);
  box-shadow:0 8px 0 var(--kid-ink);font-family:'Fredoka';font-weight:700;font-size:1.35rem;color:var(--kid-ink);
  background:var(--kid-yellow);transition:transform .07s,box-shadow .07s;margin-bottom:16px;text-align:center;line-height:1.2}
.kbtn:active{transform:translateY(6px);box-shadow:0 2px 0 var(--kid-ink)}
.kbtn.blue{background:var(--kid-blue);color:#fff}
.kbtn.green{background:var(--kid-green);color:#fff}
.kbtn.red{background:var(--kid-red);color:#fff}
.kbtn.purple{background:var(--kid-purple);color:#fff}
.kbtn.white{background:#fff}

/* Mapa de aventura */
.map{position:relative;padding:10px 0 30px}
.map::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:8px;transform:translateX(-50%);
  background:repeating-linear-gradient(180deg,rgba(255,255,255,.9) 0 18px,transparent 18px 34px);border-radius:8px}
.node{position:relative;width:clamp(96px,26vw,120px);height:clamp(96px,26vw,120px);border-radius:50%;border:5px solid var(--kid-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 34px;
  box-shadow:0 9px 0 rgba(30,42,74,.85);font-family:'Fredoka';font-weight:700;background:#fff;z-index:1}
.node .ic{font-size:clamp(2.1rem,7vw,2.6rem);line-height:1}
.node .nm{font-size:.72rem;margin-top:2px}
.node.left{transform:translateX(min(-78px,-21vw))}
.node.right{transform:translateX(max(78px,21vw))}
@media(min-width:600px){.node.left{transform:translateX(-130px)}.node.right{transform:translateX(130px)}}
.node.open{background:var(--kid-yellow)}
.node.open:active{box-shadow:0 2px 0 rgba(30,42,74,.85)}
.node.locked{background:#D7DCE6;opacity:.85;filter:saturate(.4)}
.node.done{background:var(--kid-green);color:#fff}
.node .stars{position:absolute;bottom:-16px;font-size:1rem;letter-spacing:-2px;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.node.current::after{content:"¡JUEGA!";position:absolute;top:-26px;background:var(--kid-red);color:#fff;
  font-size:.7rem;padding:4px 12px;border-radius:999px;border:3px solid var(--kid-ink);animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* Globos */
#sky{position:relative;height:56vh;min-height:340px;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#3B82F6,#7DD3FC);border:4px solid var(--kid-ink);box-shadow:0 8px 0 rgba(30,42,74,.85)}
.balloon{position:absolute;bottom:-150px;width:96px;height:118px;border-radius:50% 50% 48% 48%;
  display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;font-size:1.7rem;color:#fff;
  border:4px solid rgba(0,0,0,.25);animation:rise linear forwards;text-shadow:0 2px 0 rgba(0,0,0,.3);cursor:pointer}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:3px;height:26px;background:rgba(255,255,255,.8)}
@keyframes rise{from{bottom:-150px}to{bottom:110%}}
.balloon.pop{animation:pop .3s forwards!important}
@keyframes pop{to{transform:scale(2.2);opacity:0}}
.balloon.shake{animation-play-state:paused;animation:none;outline:none}
@keyframes shakeX{0%,100%{margin-left:0}25%{margin-left:-10px}75%{margin-left:10px}}

/* Memoria */
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mem{aspect-ratio:3/3.4;perspective:600px;cursor:pointer}
.mem .in{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mem.flip .in{transform:rotateY(180deg)}
.mem .f,.mem .b{position:absolute;inset:0;border-radius:18px;border:4px solid var(--kid-ink);
  display:flex;align-items:center;justify-content:center;backface-visibility:hidden;font-family:'Fredoka';font-weight:700;
  font-size:1.05rem;text-align:center;padding:6px;box-shadow:0 5px 0 rgba(30,42,74,.7)}
.mem .f{background:var(--kid-blue);color:#fff;font-size:2rem}
.mem .b{background:#fff;transform:rotateY(180deg)}
.mem.ok .b{background:var(--kid-green);color:#fff}



/* Robot */
.robotgrid{display:grid;gap:8px;margin:14px 0}
.robotgrid .cell{aspect-ratio:1;border-radius:16px;background:rgba(255,255,255,.85);border:3px solid var(--kid-ink);
  display:flex;align-items:center;justify-content:center;font-size:2rem}
.cmdrow{display:flex;flex-wrap:wrap;gap:8px;min-height:58px;padding:10px;border-radius:18px;background:rgba(255,255,255,.7);border:3px dashed var(--kid-ink);margin-bottom:12px}
.cmd{font-size:1.6rem;padding:4px 10px;border-radius:12px;background:#fff;border:3px solid var(--kid-ink)}
.cmdbtns{display:flex;gap:10px;margin-bottom:12px}
.cmdbtns button{flex:1;font-size:1.9rem;padding:14px;border-radius:18px;border:4px solid var(--kid-ink);background:var(--kid-blue);color:#fff;box-shadow:0 6px 0 var(--kid-ink)}
.cmdbtns button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--kid-ink)}

/* ================= TEMA TEEN ================= */
body.teen{background:radial-gradient(1100px 500px at 80% -10%,#3A1D6E 0%,var(--teen-bg) 55%);background-attachment:fixed;
  color:var(--teen-ink);font-family:'Space Grotesk',sans-serif}
body.teen .card{background:var(--teen-card);border:1px solid #322B52;border-radius:20px;padding:20px;margin-bottom:16px}
.tbtn{display:block;width:100%;min-height:62px;padding:16px 18px;border-radius:16px;font-weight:600;font-size:1.1rem;
  background:var(--teen-card);color:var(--teen-ink);border:1px solid #3A3360;margin-bottom:12px;text-align:left;transition:transform .08s,border-color .15s}
.tbtn:active{transform:scale(.98)}
.tbtn.acc{background:linear-gradient(120deg,var(--teen-violet),var(--teen-pink));border:none;color:#fff;text-align:center;font-weight:700}
.tbtn.cyan{border-color:var(--teen-cyan);color:var(--teen-cyan)}
.tbtn.opt{font-size:1.15rem}
body.teen .mut{color:var(--teen-mut)}
.eq{display:flex;align-items:flex-end;gap:4px;height:30px}
.eq i{width:6px;border-radius:3px;background:linear-gradient(180deg,var(--teen-pink),var(--teen-violet));animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}.eq i:nth-child(5){animation-delay:.6s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}
.word{cursor:pointer;border-bottom:2px dashed var(--teen-cyan);border-radius:3px;padding:0 1px}
.word:active,.word.tapped{background:rgba(34,211,238,.2)}
.timerbar{height:10px;border-radius:999px;background:#2B2547;overflow:hidden;margin:8px 0 14px}
.timerbar>div{height:100%;background:linear-gradient(90deg,var(--teen-cyan),var(--teen-violet));transition:width .25s linear}
.combo{position:fixed;top:64px;right:14px;background:linear-gradient(120deg,var(--teen-violet),var(--teen-pink));color:#fff;
  font-weight:700;padding:8px 16px;border-radius:999px;font-size:1.05rem;z-index:50;animation:pulse .6s}
.flash{perspective:800px;height:300px;margin-bottom:14px}
.flash .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;cursor:pointer}
.flash.flip .in{transform:rotateY(180deg)}
.flash .f,.flash .b{position:absolute;inset:0;border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  backface-visibility:hidden;padding:20px;text-align:center}
.flash .f{background:linear-gradient(140deg,#2A2350,#1C1830);border:1px solid #3A3360;font-size:2.1rem;font-weight:700}
.flash .b{background:linear-gradient(140deg,var(--teen-violet),var(--teen-pink));transform:rotateY(180deg);font-size:1.7rem;font-weight:700;color:#fff}
.flash .hint{font-size:.85rem;color:var(--teen-mut);margin-top:14px;font-weight:400}
.flash .b .hint{color:rgba(255,255,255,.8)}

/* ================= TEMA PADRE ================= */
body.parent .card{background:#fff;border:1px solid var(--par-line);border-radius:14px;padding:18px;margin-bottom:16px}
.pbtn{display:inline-block;padding:12px 18px;border-radius:10px;font-weight:800;background:var(--par-acc);color:#fff;margin:4px 8px 4px 0;font-size:.95rem}
.pbtn.ghost{background:#fff;color:var(--par-ink);border:1px solid var(--par-line)}
.pbtn.danger{background:#DC2626}
body.parent table{width:100%;border-collapse:collapse;font-size:.85rem}
body.parent th,body.parent td{padding:9px 6px;text-align:left;border-bottom:1px solid var(--par-line)}
body.parent th{color:var(--par-mut);font-weight:800;font-size:.72rem;text-transform:uppercase}
.mut{color:var(--par-mut)}
.tag{display:inline-block;padding:3px 10px;border-radius:7px;font-size:.78rem;font-weight:800;background:rgba(14,148,136,.12);color:var(--par-acc)}
.barchart{display:flex;align-items:flex-end;gap:7px;height:120px;margin-top:10px}
.barchart .bar{flex:1;background:var(--par-acc);border-radius:7px 7px 0 0;min-height:4px;position:relative}
.barchart .bar span{position:absolute;bottom:-22px;left:0;right:0;text-align:center;font-size:.62rem;color:var(--par-mut)}
input[type=text],input[type=password],input[type=number]{width:100%;padding:14px;border-radius:12px;border:2px solid rgba(127,127,127,.35);background:transparent;color:inherit;margin-bottom:12px;font-size:1rem}

/* ================= COMUNES ================= */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:1rem}
body.kid .pill{background:#fff;border:4px solid var(--kid-ink);box-shadow:0 4px 0 rgba(30,42,74,.8);font-family:'Fredoka'}
body.teen .pill{background:var(--teen-card);border:1px solid #3A3360}
body.parent .pill{background:#fff;border:1px solid var(--par-line)}
.back{font-size:1.6rem;background:none;font-weight:800;padding:6px 12px;border-radius:12px}
body.kid .back{background:#fff;border:4px solid var(--kid-ink);box-shadow:0 4px 0 rgba(30,42,74,.8)}
body.teen .back{background:var(--teen-card);border:1px solid #3A3360}
h1.title{font-size:1.7rem;line-height:1.2;margin-bottom:6px}
.bigq{font-size:1.5rem;font-weight:800;margin:8px 0 18px;line-height:1.3}
body.teen .bigq{font-weight:700;font-size:1.25rem}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;padding:16px 26px;border-radius:20px;
  font-weight:800;font-size:1.3rem;text-align:center;min-width:70%;animation:toastIn .25s}
@keyframes toastIn{from{transform:translate(-50%,30px);opacity:0}}
.toast.ok{background:var(--kid-green);color:#fff;border:4px solid #1E2A4A}
.toast.no{background:var(--kid-red);color:#fff;border:4px solid #1E2A4A}
body.teen .toast.ok{background:#16A34A;border:none}
body.teen .toast.no{background:#DC2626;border:none}
.confetti{position:fixed;top:-40px;z-index:70;font-size:1.6rem;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.endcard{text-align:center;padding:34px 22px!important}
.endcard .big{font-size:4.5rem;line-height:1;margin-bottom:8px}
.endcard h2{font-size:1.6rem;margin-bottom:6px}
.progressdots{display:flex;gap:8px;justify-content:center;margin:8px 0 16px}
.progressdots i{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.18)}
body.teen .progressdots i{background:#332C55}
.progressdots i.on{background:var(--kid-green)}
body.teen .progressdots i.on{background:var(--teen-cyan)}
.misionrow{display:flex;align-items:center;gap:12px;padding:9px 0;font-weight:700;font-size:1.02rem}
.misionrow .chk{width:30px;height:30px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border:3px solid currentColor;font-size:1rem}
.misionrow.done{opacity:.8}
.misionrow.done .chk{background:var(--kid-green);border-color:var(--kid-green);color:#fff}
.profilecard{text-align:center;padding:26px!important;cursor:pointer}
.profilecard .av{font-size:3.6rem;display:block;margin-bottom:8px}
.tip{font-size:.85rem;opacity:.85;margin-top:10px;line-height:1.45}
.spin{display:inline-block;animation:spinA 1s linear infinite}
@keyframes spinA{to{transform:rotate(360deg)}}

/* ===== MODO EXAMEN (UI moderna) ===== */
.exhero{position:relative;border-radius:28px;padding:22px 20px 20px;margin-bottom:16px;text-align:center;color:#fff;
 background:linear-gradient(135deg,#7C3AED 0%,#DB2777 55%,#F59E0B 120%);
 box-shadow:0 12px 30px rgba(124,58,237,.35),0 6px 0 rgba(30,42,74,.28);overflow:hidden}
.exhero::after{content:"";position:absolute;inset:-40% -20% auto auto;width:220px;height:220px;border-radius:50%;
 background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%);pointer-events:none}
.exhero-t{font-family:'Fredoka';font-weight:700;font-size:clamp(1.35rem,6.5vw,1.8rem);margin-top:10px;position:relative}
.exhero-p{font-size:clamp(.92rem,4vw,1.05rem);opacity:.95;margin-top:2px;font-weight:600;position:relative}
.exring{position:relative;width:clamp(112px,32vw,140px);height:clamp(112px,32vw,140px);margin:0 auto}
.exring svg{width:100%;height:100%;display:block}
.exring circle{transition:stroke-dashoffset 1s cubic-bezier(.34,1.4,.64,1)}
.exringtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
 font-family:'Fredoka';font-weight:700;font-size:clamp(1.5rem,7vw,2rem)}
.exgoal{border-radius:18px;padding:13px 16px;margin-bottom:16px;font-family:'Fredoka';font-weight:600;
 font-size:clamp(.92rem,4.1vw,1.06rem);line-height:1.4;text-align:center;
 background:linear-gradient(135deg,#FEF3C7,#FDE68A);border:3px solid #D97706;color:#78350F}
.exgoal.ok{background:linear-gradient(135deg,#D1FAE5,#A7F3D0);border-color:#059669;color:#065F46}
.excard{background:#fff;border-radius:24px;padding:16px;margin-bottom:16px;
 border:3px solid var(--sc);box-shadow:0 8px 22px rgba(30,42,74,.13)}
.exhead{font-family:'Fredoka';font-weight:700;font-size:clamp(1.08rem,4.8vw,1.3rem);color:var(--sc);
 display:flex;align-items:center;gap:9px;margin-bottom:12px;padding-bottom:9px;border-bottom:2px dashed var(--sc)}
.exhead span{font-size:1.35em}
.exu{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#F8FAFC;border:2px solid #E2E8F0;
 border-radius:16px;padding:13px 14px;margin-bottom:9px;font-family:'Fredoka';font-weight:600;
 transition:transform .1s,box-shadow .15s,border-color .15s;color:var(--kid-ink)}
.exu:active{transform:scale(.975)}
.exu:hover{border-color:var(--sc);box-shadow:0 4px 14px rgba(0,0,0,.09)}
.exi{font-size:clamp(1.5rem,7vw,1.9rem);flex-shrink:0;width:1.6em;text-align:center}
.exn{flex:1;font-size:clamp(.95rem,4.2vw,1.1rem);line-height:1.25}
.exb{font-size:.8rem;font-weight:700;background:var(--sc);color:#fff;padding:5px 11px;border-radius:999px;white-space:nowrap}
.numdisp{background:#fff;border:4px solid var(--kid-ink);border-radius:20px;min-height:74px;margin:14px 0;
 display:flex;align-items:center;justify-content:center;font-family:'Fredoka';font-weight:700;
 font-size:clamp(2.2rem,11vw,3rem);letter-spacing:.12em;box-shadow:0 6px 0 rgba(30,42,74,.8)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.numpad .key{aspect-ratio:1.35}
.numpad .key.okk{background:var(--kid-green);color:#fff}
/* botón examen destacado en el mapa */
.exbtn{position:relative;overflow:hidden;background:linear-gradient(135deg,#7C3AED,#DB2777)!important;color:#fff!important}
.exbtn::after{content:"";position:absolute;top:0;left:-60%;width:45%;height:100%;
 background:linear-gradient(90deg,transparent,rgba(255,255,255,.42),transparent);animation:shine 3.4s infinite}
@keyframes shine{0%{left:-60%}55%,100%{left:130%}}
.lockchip{display:inline-block;font-size:.72rem;background:rgba(0,0,0,.28);padding:3px 9px;border-radius:999px;margin-left:6px;font-weight:700}


/* ===== TRIPULANTES ESPACIALES ===== */
.crew{display:block}
.shipbg{position:relative;border-radius:28px;padding:18px 16px;margin-bottom:16px;overflow:hidden;
 background:linear-gradient(165deg,#1E1B4B 0%,#312E81 45%,#4C1D95 100%);
 box-shadow:0 12px 30px rgba(30,27,75,.4),inset 0 1px 0 rgba(255,255,255,.15)}
.shipbg::before{content:"";position:absolute;inset:0;pointer-events:none;
 background-image:radial-gradient(1.6px 1.6px at 12% 22%,#fff,transparent),radial-gradient(1.4px 1.4px at 78% 15%,#fff,transparent),
 radial-gradient(1.8px 1.8px at 40% 62%,#fff,transparent),radial-gradient(1.3px 1.3px at 88% 74%,#fff,transparent),
 radial-gradient(1.5px 1.5px at 62% 38%,#fff,transparent),radial-gradient(1.2px 1.2px at 25% 82%,#fff,transparent);
 opacity:.85;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.5}50%{opacity:1}}
.shiprow{position:relative;display:flex;align-items:center;gap:14px;z-index:1}
.crewbox{width:clamp(74px,20vw,96px);flex-shrink:0;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.shipinfo{flex:1;color:#fff}
.shipinfo h1{font-family:'Fredoka';font-weight:700;font-size:clamp(1.15rem,5.4vw,1.5rem);line-height:1.15;margin-bottom:3px}

<body>
<div id="app"></div>
<script>
"use strict";
/* ============ ESTADO ============ */
const DEFAULT_STATE={pin:"1234",geminiKey:"",examMode:true,kidCfg:{maxN:20,dailyGoal:3},customTopics:[],videos:[],remind:{on:false,time:"17:00",last:""},
 profiles:{
  nino:{name:"Explorador",emoji:"🦖",coins:0,xp:0,streak:0,lastDay:"",days:{},stats:{},map:{unlocked:1,stars:{}},worldWins:{},critters:[],mastery:{},exam:{units:{},goal:{}},enUnits:{},shop:{owned:{skin:['red','blue'],hat:['none'],pet:['none']},eq:{skin:'red',hat:'none',pet:'none'}},signals:{read:{n:0,slow:0,err:0},math:{n:0,err:0},en:{n:0,err:0},seq:{n:0,err:0}}},
  nina:{name:"Estrella",emoji:"🎧",coins:0,xp:0,streak:0,lastDay:"",days:{},stats:{},best:{}}
 },aiBank:{nina:[]}};
let S=load();
function load(){try{const r=localStorage.getItem("academiaFam2");if(r){const s=JSON.parse(r);const base=JSON.parse(JSON.stringify(DEFAULT_STATE));deepMerge(base,s);return base;}}catch(e){}return JSON.parse(JSON.stringify(DEFAULT_STATE));}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==="object"&&!Array.isArray(s[k])){if(!t[k])t[k]={};deepMerge(t[k],s[k]);}else t[k]=s[k];}}
function save(){localStorage.setItem("academiaFam2",JSON.stringify(S));}
const app=document.getElementById("app");
let current={profile:null};
function prof(){return S.profiles[current.profile];}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function seedFromStr(str){let h=1779033703;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);}return h>>>0;}
function mulberry32(a){return function(){a|=0;a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function dailyRng(x){return mulberry32(seedFromStr(todayStr()+(x||"")));}
function shuffled(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor((rng?rng():Math.random())*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pick(arr,rng){return arr[Math.floor((rng?rng():Math.random())*arr.length)];}
function rnd(n){return Math.floor(Math.random()*n);}

/* ============ SONIDO + CONFETI ============ */
let AC=null;
function beep(freqs,dur){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 freqs.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(AC.destination);
 g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.start(t);o.stop(t+dur);t+=dur*0.6;});}catch(e){}}
function sOK(){beep([523,659,784],.18);}
function sNO(){beep([196,147],.22);}
function sWIN(){beep([523,659,784,1047],.16);}
function tone(f,d){beep([f],d);}
function confetti(n){const ems=["🎉","⭐","🟡","💙","🟢","✨","🎈"];
 for(let i=0;i<(n||24);i++){const e=document.createElement("div");e.className="confetti";
 e.textContent=ems[rnd(ems.length)];e.style.left=rnd(100)+"vw";e.style.animationDuration=(1.4+Math.random()*1.4)+"s";
 document.body.appendChild(e);setTimeout(()=>e.remove(),3000);}}
function toast(msg,ok,ms){const t=document.createElement("div");t.className="toast "+(ok?"ok":"no");t.innerHTML=msg;
 document.body.appendChild(t);setTimeout(()=>t.remove(),ms||1400);}

/* ============ VOZ (Web Speech API) ============ */
let VOICES=[];
function loadVoices(){try{VOICES=window.speechSynthesis.getVoices();}catch(e){}}
if("speechSynthesis"in window){loadVoices();window.speechSynthesis.onvoiceschanged=loadVoices;}
function speakEN(text,onEnd){
 if(!("speechSynthesis"in window)){toast("🔇 Tu navegador no tiene voz. Prueba en Chrome.",false,2000);if(onEnd)onEnd();return;}
 window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.82;u.pitch=1;
 const v=VOICES.find(x=>/en[-_]US/i.test(x.lang))||VOICES.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;
 if(onEnd)u.onend=onEnd;
 window.speechSynthesis.speak(u);}
function speakES(text){if(!("speechSynthesis"in window))return;window.speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);u.lang="es-ES";u.rate=.9;
 const v=VOICES.find(x=>/^es/i.test(x.lang));if(v)u.voice=v;window.speechSynthesis.speak(u);}
function hasVoice(){return "speechSynthesis"in window;}
function sanit(t){return esc(String(t)).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");}
function striptags(t){return String(t).replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();}

/* ============ MOTOR DE CONTENIDO INFINITO (IA + banco fijo + adaptativo) ============ */
/* Cada "tema" sabe pedirle a Gemini preguntas nuevas, y tiene un respaldo fijo. */
const KID_TOPICS={
 sumas2:{name:"Sumas",emoji:"➕",prompt:"sumas de 2 cifras (resultado menor a 100) para un niño de 6-7 años en primero",
   fallback:()=>{const a=2+rnd(40),b=2+rnd(40);return mcq(a+" + "+b+" = ?",a+b);}},
 restas2:{name:"Restas",emoji:"➖",prompt:"restas simples sin prestar para un niño de 6-7 años, resultado positivo",
   fallback:()=>{const a=5+rnd(40),b=1+rnd(a-1);return mcq(a+" − "+b+" = ?",a-b);}},
 restapres:{name:"Restas prestando",emoji:"🔄",prompt:"restas de 2 cifras que requieren prestar/llevar, para niño de 7 años, resultado positivo",
   fallback:()=>{let a,b;do{a=20+rnd(70);b=5+rnd(a-5);}while((a%10)>=(b%10));return mcq(a+" − "+b+" = ?",a-b);}},
 sumas3:{name:"Sumas de 3 cifras",emoji:"🧮",prompt:"sumas de 3 cifras (100-999) para niño de 7 años",
   fallback:()=>{const a=100+rnd(400),b=100+rnd(400);return mcq(a+" + "+b+" = ?",a+b);}},
 multi:{name:"Inicio multiplicación",emoji:"✖️",prompt:"multiplicaciones muy fáciles (tablas del 2, 3 y 5, factores hasta 5) explicadas como grupos, para niño de 7 años",
   fallback:()=>{const t=pick([2,3,5]),n=1+rnd(5);return mcq(t+" × "+n+" = ?",t*n,t+" grupos de "+n);}},
 ordinales:{name:"Ordinales",emoji:"🥇",prompt:"preguntas de números ordinales (primero a décimo) con ejemplos de carreras o filas, para niño de 6-7 años",
   fallback:()=>pick([mcq("Si llegas después del 1°, ¿en qué lugar vas?","2°",null,["2°","3°","1°"]),mcq("El que gana la carrera llega…","1°",null,["1°","3°","5°"]),mcq("Después del 3° viene el…","4°",null,["4°","2°","5°"])])},
 izqder:{name:"Izquierda/Derecha",emoji:"↔️",prompt:"preguntas sobre izquierda y derecha, arriba y abajo, con objetos o animalitos, para niño de 6 años",
   fallback:()=>pick([mcq("Con qué mano escribes la mayoría: la…","derecha",null,["derecha","de arriba","del pie"]),mcq("🚗➡️ ¿hacia dónde va el carro?","Derecha",null,["Derecha","Izquierda","Arriba"]),mcq("⬅️🐶 ¿hacia dónde mira el perro?","Izquierda",null,["Izquierda","Derecha","Abajo"])])},
 diasES:{name:"Días (español)",emoji:"📅",prompt:"preguntas sobre los días de la semana en español (orden, antes/después) para niño de 6-7 años",
   fallback:()=>pick([mcq("¿Qué día viene después del lunes?","Martes",null,["Martes","Domingo","Viernes"]),mcq("¿Qué día va antes del sábado?","Viernes",null,["Viernes","Domingo","Lunes"]),mcq("¿Cuántos días tiene la semana?","7",null,["7","5","10"])])},
 mesesES:{name:"Meses (español)",emoji:"🗓️",prompt:"preguntas sobre los meses del año en español (orden, cuál va antes/después) para niño de 7 años",
   fallback:()=>pick([mcq("¿Qué mes viene después de enero?","Febrero",null,["Febrero","Marzo","Diciembre"]),mcq("¿Con qué mes empieza el año?","Enero",null,["Enero","Diciembre","Junio"]),mcq("¿Cuántos meses tiene el año?","12",null,["12","10","7"])])},
 logica:{name:"Lógica",emoji:"🧩",prompt:"acertijos de lógica simple (cuál no pertenece, el más grande, secuencias cortas) con emojis, para niño de 6-7 años",
   fallback:()=>pick(LOGIC_KID.map(q=>({q:q.q+" "+q.scene,ops:q.ops,a:q.a})))},
 secuencias:{name:"Secuencias",emoji:"➡️",prompt:"completar secuencias y patrones de números o figuras para niño de 6-7 años",
   fallback:()=>{const q=pick(SEQUENCES);return{q:"¿Qué sigue? "+q.show.join(" "),ops:q.ops,a:q.a};}},
 // INGLÉS (con audio)
 en_animals:{name:"Animales (EN)",emoji:"🐶",en:true,prompt:"vocabulario de animales en inglés MUY básicos y conocidos (dog, cat, fish, bird, cow, horse) para niño de 6 años principiante absoluto",
   fallback:()=>enMCQ(EN_VOCAB.animals)},
 en_colors:{name:"Colores (EN)",emoji:"🎨",en:true,prompt:"colores en inglés básicos para niño de 6 años principiante",
   fallback:()=>enMCQ(EN_VOCAB.colors)},
 en_body:{name:"Cuerpo (EN)",emoji:"🧍",en:true,prompt:"partes del cuerpo en inglés básicas (hand, eye, nose, mouth, foot, ear, hair) para niño de 6 años",
   fallback:()=>enMCQ(EN_VOCAB.body)},
 en_house:{name:"La casa (EN)",emoji:"🏠",en:true,prompt:"partes de la casa en inglés básicas (door, window, bed, table, chair, kitchen, bathroom) para niño de 7 años",
   fallback:()=>enMCQ([["door","puerta","🚪"],["window","ventana","🪟"],["bed","cama","🛏️"],["table","mesa","🪑"],["chair","silla","🪑"],["kitchen","cocina","🍳"]])},
 en_numbers:{name:"Números (EN)",emoji:"🔢",en:true,prompt:"números en inglés del 1 al 10 para niño de 6 años",
   fallback:()=>enMCQ(EN_VOCAB.numbers)},
 en_vowels:{name:"Vocales (EN)",emoji:"🔤",en:true,prompt:"las vocales en inglés (a-e-i-o-u) y su sonido, con palabras de ejemplo simples, para niño de 7 años",
   fallback:()=>pick([enMCQ([["apple","manzana","🍎"]]),enMCQ([["egg","huevo","🥚"]]),enMCQ([["orange","naranja","🍊"]])])},
 en_days:{name:"Días (EN)",emoji:"📆",en:true,prompt:"días de la semana en inglés (Monday-Sunday) para niño de 7 años principiante",
   fallback:()=>enMCQ([["Monday","lunes","1️⃣"],["Tuesday","martes","2️⃣"],["Friday","viernes","5️⃣"],["Sunday","domingo","☀️"]])},
 en_phrases:{name:"Frases (EN)",emoji:"💬",en:true,prompt:"frases de saludo y cortesía MUY básicas en inglés (hello, thank you, good morning) para niño de 6-7 años",
   fallback:()=>{const p=pick(EN_PHRASES);return enMCQ([[p[0],p[1],"💬"]]);}},

   fallback:()=>{const a=1+rnd(maxN());const b=Math.random()<0.25?a:1+rnd(maxN());
    const ans=a>b?"> mayor":a<b?"< menor":"= igual";
    return{q:"¿Qué signo va?   "+a+"  ___  "+b,ops:["> mayor","< menor","= igual"],a:-1,fixAns:ans};}},
 problemas:{name:"Problemas",emoji:"🍎",prompt:"problemas matemáticos cortos con nombres de niños y objetos (manzanas, dulces, canicas), suma o resta, números hasta "+maxN()+", para niño de 6-7 años. Frases simples y claras",
   fallback:()=>{const N=["Laura","Mateo","Sofía","Juan","Emma","Lucas","Ana"];
    const O=[["manzanas","🍎"],["dulces","🍬"],["canicas","🔵"],["galletas","🍪"],["globos","🎈"],["carritos","🚗"],["stickers","⭐"]];
    const n=pick(N),o=pick(O),M=Math.max(10,maxN());
    const t=Math.random();
    if(t<0.4){const x=4+rnd(M-4),y=1+rnd(Math.min(x-1,9));
     return mcq(n+" tiene "+x+" "+o[0]+" "+o[1]+" y le presta "+y+" a su amigo. ¿Cuántas le quedan?",x-y);}
    if(t<0.8){const x=2+rnd(Math.floor(M/2)),y=1+rnd(Math.floor(M/2));
     return mcq(n+" tiene "+x+" "+o[0]+" "+o[1]+" y le regalan "+y+" más. ¿Cuántas tiene ahora?",x+y);}
    const g=2+rnd(4),c=2+rnd(4);
    return mcq(n+" tiene "+g+" cajas y en cada una hay "+c+" "+o[0]+" "+o[1]+". ¿Cuántas hay en total?",g*c);}}

function registerCustomTopics(){(S.customTopics||[]).forEach((t,i)=>{
 KID_TOPICS["custom_"+i]={name:t.name,emoji:t.emoji||"🎯",custom:true,
  prompt:t.prompt+" — para niño de 6-7 años (primero de primaria), lenguaje muy sencillo",
  fallback:()=>({q:"Este tema necesita la clave de Gemini 🤖",ops:["Ok"],a:0})};});}
/* helpers para construir preguntas */
function mcq(q,ans,hint,fixedOps){
 let ops;
 if(fixedOps)ops=fixedOps.slice();
 else{const set=new Set([ans]);while(set.size<3){const d=ans+(1+rnd(5))*(Math.random()<.5?-1:1);if(d>=0)set.add(d);}ops=[...set].map(String);}
 ops=shuffled(ops);return{q,ops,a:ops.indexOf(String(ans)),hint};}
function enMCQ(pool){const w=pick(pool);return{q:'¿Qué significa "'+w[0]+'"?',ops:shuffled([w[1],...pickN(["perro","casa","sol","agua","rojo","mano","mesa","cinco","gato","leche"].filter(x=>x!==w[1]),2)]),a:-1,word:w[0],pic:w[2]||"🔊",es:w[1],en:true,fixAns:w[1]};}
function pickN(arr,n){return shuffled(arr).slice(0,n);}

/* dominio adaptativo: registra desempeño por tema y decide cuál sale */
function topicMastery(){const p=prof();if(!p.mastery)p.mastery={};return p.mastery;}
function recordTopic(topic,correct){const m=topicMastery();
 if(!m[topic])m[topic]={n:0,ok:0,streak:0};
 m[topic].n++;if(correct){m[topic].ok++;m[topic].streak++;}else m[topic].streak=0;save();}
function weakestTopics(keys,count){
 const m=topicMastery();
 const scored=keys.map(k=>{const s=m[k];const rate=s&&s.n>=3?s.ok/s.n:0.5;const seen=s?s.n:0;
  // peso: prioriza baja tasa de acierto y temas poco vistos
  return{k,w:(1-rate)*2 + (seen<3?1:0) + Math.random()*0.4};});
 scored.sort((a,b)=>b.w-a.w);
 return scored.slice(0,count).map(s=>s.k);}

/* generar una tanda de retos de un tema (IA si hay clave, si no fallback) */
async function buildChallenges(topicKey,n){
 const topic=KID_TOPICS[topicKey];
 if(S.geminiKey){
  try{
   const obj=await geminiJSON('Eres un tutor de primaria. Crea '+n+' preguntas de opción múltiple sobre: '+topic.prompt+'. Cada una con 3 opciones y una sola correcta. Lenguaje español sencillo y frases cortas. Responde SOLO JSON válido sin markdown: {"items":[{"q":"pregunta","ops":["correcta","incorrecta","incorrecta"],"a":0}]} . El índice "a" indica cuál opción es correcta.');
   if(obj.items&&obj.items.length){return obj.items.map(it=>{
    // mezclar opciones para que la correcta no siempre sea la 0
    const correct=it.ops[it.a];const ops=shuffled(it.ops);
    return{q:it.q,ops,a:ops.indexOf(correct),word:topic.en?firstEnWord(it.q):null};});}
  }catch(e){/* cae al fallback */}
 }
 // fallback fijo
 const out=[];for(let i=0;i<n;i++){const f=topic.fallback();
  if(f.a===-1&&f.fixAns!==undefined){f.ops=[...new Set(f.ops)];f.a=f.ops.indexOf(f.fixAns);}
  out.push(f);}
 return out;}
function firstEnWord(q){const m=q.match(/"([A-Za-z]+)"/);return m?m[1]:null;}

/* ============ GAMIFICACIÓN ============ */
function touchDay(){const p=prof(),t=todayStr();
 if(p.lastDay!==t){const y=new Date();y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  p.streak=(p.lastDay===ys)?p.streak+1:1;p.lastDay=t;}
 if(!p.days[t])p.days[t]={ex:0,ok:0,sec:0,missions:[],games:0};
 return p.days[t];}
function recordAnswer(subject,correct,secs){const p=prof(),d=touchDay();
 if(!p.stats[subject])p.stats[subject]={attempts:0,correct:0,sec:0};
 p.stats[subject].attempts++;d.ex++;p.stats[subject].sec+=(secs||0);d.sec+=(secs||0);
 if(correct){p.stats[subject].correct++;d.ok++;p.coins+=2;p.xp+=5;}else p.xp+=1;
 // señales de apoyo (solo niño): tiempos altos y errores por área
 if(current.profile==="nino"){
  if(!p.signals)p.signals={read:{n:0,slow:0,err:0},math:{n:0,err:0},en:{n:0,err:0},seq:{n:0,err:0}};
  const readSubj=["Comprensión","Letras"].includes(subject);
  const mathSubj=["Mate","Problemas","Números"].includes(subject);
  const enSubj=subject==="Inglés";
  const seqSubj=["Secuencias","Lógica"].includes(subject);
  if(readSubj){p.signals.read.n++;if(secs>=25)p.signals.read.slow++;if(!correct)p.signals.read.err++;}
  if(mathSubj){p.signals.math.n++;if(!correct)p.signals.math.err++;}
  if(enSubj){p.signals.en.n++;if(!correct)p.signals.en.err++;d.enDone=true;}
  if(seqSubj){p.signals.seq.n++;if(!correct)p.signals.seq.err++;}
 }
 save();}

let LT={};

function renderLetters(){
 const grp=LT.set[LT.i];
 if(!grp)return nodeWin(starsFor(LT.ok,Math.max(1,LT.qpool?LT.qpool.length:LT.ok)),"Letras");
 if(LT.phase==="learn"){
  const c=grp.cases[LT.ci];const last=LT.ci===grp.cases.length-1;
  render(topbar("screenKidMap()")
  +'<h2 style="font-size:clamp(1.2rem,5.5vw,1.5rem);text-align:center;margin-bottom:4px">🔡 El sonido de la <span style="color:var(--kid-blue);font-size:1.4em">'+grp.letter+'</span></h2>'

  +'<button class="speaker" onclick="speakES(\''+c[0]+'\')"><span class="ic">🔊</span> Escuchar "'+c[0]+'"</button>'
  +(last?'<button class="kbtn green" onclick="lettersToQuiz()">¡A practicar! 🎯</button>'
        :'<button class="kbtn blue" onclick="LT.ci++;renderLetters()">Siguiente →</button>'));
  return;}
 // quiz: ¿con qué letra empieza?
 const q=LT.qpool[LT.qi];
 if(!q)return nodeWin(starsFor(LT.ok,LT.qpool.length),"Letras");
 const order=shuffled(q.ops);LT.order=order;
 render(topbar("screenKidMap()")
 +'<div class="progressdots">'+dots(LT.qpool.length,LT.qi)+'</div>'

/* Toma uno o varios temas, pide retos (IA o fallback) y los juega con audio si es inglés. */
let CH={};
async function playTopics(label,topicKeys,opts){
 opts=opts||{};
 setTheme("kid");
 render(topbar("screenKidMap()")
  +'<div class="card center" style="padding:40px"><div style="font-size:3rem" class="spin">⏳</div>'
  +'<h2 style="margin-top:10px">Preparando tus retos…</h2>'
  +'<p class="mut">'+(S.geminiKey?"Creando preguntas nuevas con IA ✨":"Cargando retos")+'</p></div>');
 // elige los temas más débiles si son varios
 const chosen = topicKeys.length>1 ? weakestTopics(topicKeys, Math.min(opts.topicsPerSession||2,topicKeys.length)) : topicKeys;
 let items=[];
 for(const tk of chosen){
  const part=await buildChallenges(tk, opts.perTopic||4);
  part.forEach(it=>it._topic=tk);
  items=items.concat(part);
 }
 items=shuffled(items).slice(0,opts.total||8);
 if(!items.length){toast("No se pudo cargar. Intenta de nuevo.",false,2000);return screenKidMap();}
 CH={label,items,i:0,ok:0,wrongTopics:{}};
 renderCH();}
function renderCH(){
 const it=CH.items[CH.i];
 if(!it)return finishCH();
 const order=it.ops.map((o,k)=>({o,k}));
 const shown=shuffled(order);CH.order=shown;CH.correctK=it.a;
 const isEN=it.word||KID_TOPICS[it._topic]&&KID_TOPICS[it._topic].en;
 const topic=KID_TOPICS[it._topic];
 const head=topic?topic.emoji+" "+topic.name:CH.label;
 render(topbar("screenKidMap()")
 +'<div class="progressdots">'+dots(CH.items.length,CH.i)+'</div>'
 +'<p class="center" style="font-family:Fredoka;font-weight:600;margin-bottom:8px">'+head+' · '+(CH.i+1)+'/'+CH.items.length+'</p>'
 +(isEN&&it.pic?'<div class="bigpic">'+it.pic+'</div>':'')
 +'<div class="bigq center">'+striptags(it.q)+'</div>'
 +(isEN&&it.word?'<button class="speaker" onclick="speakEN(\''+esc(it.word).replace(/'/g,"")+'\')"><span class="ic">🔊</span> Escuchar en inglés</button>'
   :'<button class="speaker small" onclick="speakES(\''+esc(it.q).replace(/'/g,"\\'")+'\')">🔊 Leer pregunta</button>')
 +'<div class="choices2">'+shown.map((s,vi)=>'<button class="kbtn white" style="font-size:clamp(1.15rem,5vw,1.45rem)" onclick="ansCH('+vi+')">'+striptags(s.o)+'</button>').join("")+'</div>');
 if(isEN&&it.word)setTimeout(()=>speakEN(it.word.replace(/'/g,"")),350);}
function ansCH(vi){
 const it=CH.items[CH.i];
 const ok=CH.order[vi].k===CH.correctK;
 const subj=(KID_TOPICS[it._topic]&&KID_TOPICS[it._topic].en)?"Inglés":(KID_TOPICS[it._topic]?KID_TOPICS[it._topic].name:CH.label);
 recordAnswer(subj,ok,it.word?12:15);
 if(it._topic)recordTopic(it._topic,ok);
 if(ok){sOK();confetti(8);if(it.word)speakEN(it.word.replace(/'/g,""));toast("¡Correcto! 🎉",true,1000);CH.ok++;}
 else{sNO();CH.wrongTopics[it._topic]=(CH.wrongTopics[it._topic]||0)+1;
  toast("Era: "+it.ops[it.a],false,1800);}
 CH.i++;setTimeout(renderCH,ok?1000:1800);}
async function finishCH(){
 // refuerzo adaptativo: si falló mucho un tema, añade 2 retos extra de ese tema al final
 const worst=Object.entries(CH.wrongTopics).sort((a,b)=>b[1]-a[1])[0];
 if(worst&&worst[1]>=2&&!CH.reinforced){
  CH.reinforced=true;
  toast("💪 ¡Vamos a practicar "+(KID_TOPICS[worst[0]]?KID_TOPICS[worst[0]].name:"esto")+" un poco más!",false,2200);
  const extra=await buildChallenges(worst[0],2);extra.forEach(it=>it._topic=worst[0]);
  CH.items=CH.items.concat(extra);
  return setTimeout(renderCH,2200);
 }
 nodeWin(starsFor(CH.ok,CH.items.length),CH.label);}

 const list=SHTAB==="skin"?SKINS:SHTAB==="hat"?HATS:PETS;
 const it=list.find(x=>x.id===id);
 const owned=sh.owned[SHTAB]||(sh.owned[SHTAB]=[]);
 if(owned.includes(id)||it.cost===0){sh.eq[SHTAB]=id;save();beep([600,760],.09);screenShop();return;}
 if(p.coins<it.cost){sNO();toast("Te faltan "+(it.cost-p.coins)+" 🪙 — ¡sigue estudiando!",false,2000);return;}
 p.coins-=it.cost;owned.push(id);sh.eq[SHTAB]=id;save();
 sWIN();confetti(24);toast("¡Compraste "+it.nm+"! 🎉",true,1600);screenShop();}

let UN={};
function startUnit(uid){
 const u=EN_UNITS.find(x=>x.id===uid),pool=upool(u);
 const types=["listen","mean","rev","listen","spell","mean","match","rev","listen","mean"];
 UN={u,pool,steps:types.map(t=>({t,w:pick(pool)})),i:0,ok:0,hearts:3};curNode="ingles";nextUN();}
function unHead(){return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">'
 +'<div class="progressdots" style="margin:0">'+dots(UN.steps.length,UN.i)+'</div>'
 +'<span class="hearts">'+"❤️".repeat(UN.hearts)+"🤍".repeat(3-UN.hearts)+'</span></div>';}
function nextUN(){
 const st=UN.steps[UN.i];
 if(!st||UN.hearts<=0)return endUnit();
 const w=st.w,pool=UN.pool;
 if(st.t==="listen"){
  UN.opts=shuffled([w,...shuffled(pool.filter(x=>x[0]!==w[0])).slice(0,3)]);
  render(topbar("screenAcademy()")+unHead()
  +'<h2 style="font-size:clamp(1.1rem,5vw,1.35rem);text-align:center;margin-bottom:10px">🔊 Escucha y toca</h2>'
  +'<button class="speaker" onclick="speakEN(\''+w[0].replace(/'/g,"")+'\')"><span class="ic">🔊</span> Escuchar</button>'
  +'<div class="choices2">'+UN.opts.map((o,k)=>'<button class="kbtn white" style="font-size:clamp(2.6rem,12vw,3.4rem);min-height:clamp(90px,24vw,120px)" onclick="ansUN('+k+',\'pic\')">'+o[2]+'</button>').join("")+'</div>');
  setTimeout(()=>speakEN(w[0].replace(/'/g,"")),320);return;}
 if(st.t==="mean"){
  UN.opts=shuffled([w,...shuffled(pool.filter(x=>x[1]!==w[1])).slice(0,2)]);
  render(topbar("screenAcademy()")+unHead()
  +'<div class="card encard"><div class="pic">'+w[2]+'</div><div class="en">'+esc(w[0])+'</div></div>'
  +'<button class="speaker small" onclick="speakEN(\''+w[0].replace(/'/g,"")+'\')">🔊 Oír</button>'
  +'<div class="bigq center">¿Qué significa?</div>'
  +UN.opts.map((o,k)=>'<button class="kbtn white" onclick="ansUN('+k+',\'es\')">'+esc(o[1])+'</button>').join(""));
  setTimeout(()=>speakEN(w[0].replace(/'/g,"")),320);return;}
 if(st.t==="rev"){
  UN.opts=shuffled([w,...shuffled(pool.filter(x=>x[0]!==w[0])).slice(0,2)]);
  render(topbar("screenAcademy()")+unHead()
  +'<div class="card encard"><div class="pic">'+w[2]+'</div><div class="es" style="font-size:clamp(1.4rem,6vw,1.8rem);font-weight:700">'+esc(w[1])+'</div></div>'
  +'<div class="bigq center">¿Cómo se dice en inglés?</div>'
  +UN.opts.map((o,k)=>'<button class="kbtn white" onclick="ansUN('+k+',\'en\')">'+esc(o[0])+'</button>').join(""));return;}
 if(st.t==="spell"){
  const sw=pool.filter(x=>/^[a-z]{2,7}$/i.test(x[0]));UN.sw=sw.length?pick(sw):w;
  UN.typed=[];UN.usedK=[];
  const wd=UN.sw[0].toUpperCase();
  const ex="ABCDEFGHIKLMNOPRSTUWY".split("").filter(c=>!wd.includes(c));
  UN.keys=shuffled([...wd.split(""),...shuffled(ex).slice(0,2)]);renderUNsp();return;}
 if(st.t==="match"){UN.m={pairs:shuffled(pool).slice(0,3),sel:null,found:0};renderUNm();return;}}
function renderUNsp(){

 +'<div class="bigpic">'+w[2]+'</div>'

 +'<div class="letterslots">'+w[0].split("").map((_,i)=>'<div class="slot'+(UN.typed[i]?" filled":"")+'">'+(UN.typed[i]||"")+'</div>').join("")+'</div>'
 +'<div class="keys">'+UN.keys.map((c,k)=>'<button class="key'+(UN.usedK.includes(k)?" used":"")+'" onclick="tapUNk('+k+',\''+c+'\')">'+c+'</button>').join("")+'</div>'

function tapUNk(k,c){
 if(UN.usedK.includes(k)||UN.typed.length>=UN.sw[0].length)return;
 UN.typed.push(c);UN.usedK.push(k);beep([520],.06);renderUNsp();
 if(UN.typed.length===UN.sw[0].length)setTimeout(()=>stepRes(UN.typed.join("").toLowerCase()===UN.sw[0].toLowerCase(),"Se escribe "+UN.sw[0].toUpperCase(),UN.sw),260);}
function renderUNm(){
 const m=UN.m,L=m.pairs.map((p,i)=>({t:p[0],id:i})),R=shuffled(m.pairs.map((p,i)=>({t:p[1],id:i})));

 +'<h2 style="font-size:clamp(1.1rem,5vw,1.35rem);text-align:center;margin-bottom:10px">🔗 Une las parejas</h2>'
 +'<div class="matchgrid">'+L.map((c,k)=>'<button class="kbtn blue" style="margin:0" id="UL'+c.id+'" onclick="tapUNm(\'L\','+c.id+')">'+esc(c.t)+'</button>'
 +'<button class="kbtn white" style="margin:0" id="UR'+R[k].id+'" onclick="tapUNm(\'R\','+R[k].id+')">'+esc(R[k].t)+'</button>').join("")+'</div>');}
function tapUNm(side,id){
 const m=UN.m,el=document.getElementById((side==="L"?"UL":"UR")+id);
 if(!el)return;
 if(!m.sel){m.sel={side,id,el};el.classList.add("sel");return;}
 if(m.sel.side===side){m.sel.el.classList.remove("sel");m.sel={side,id,el};el.classList.add("sel");return;}
 if(m.sel.id===id){el.classList.add("matched");m.sel.el.classList.add("matched");m.found++;beep([650],.08);
  speakEN(m.pairs[id][0].replace(/'/g,""));m.sel=null;
  if(m.found===m.pairs.length)return setTimeout(()=>stepRes(true,"",null),500);
  return;}
 sNO();m.sel.el.classList.remove("sel");m.sel=null;}
function ansUN(k,mode){
 const w=UN.steps[UN.i].w;
 const ok=mode==="es"?UN.opts[k][1]===w[1]:UN.opts[k][0]===w[0];
 stepRes(ok,mode==="en"?("Era: "+w[0]):("Era: "+w[1]),w);}
function stepRes(ok,msg,w){
 recordAnswer("Inglés",ok,12);touchDay().enDone=true;
 if(ok){UN.ok++;sOK();confetti(6);if(w)speakEN((w[0]||"").replace(/'/g,""));toast("¡Correcto! 🎉",true,1000);}
 else{UN.hearts--;sNO();toast((msg||"Casi")+" · "+"❤️".repeat(Math.max(0,UN.hearts)),false,1900);}
 UN.i++;setTimeout(nextUN,ok?1000:1900);}
function endUnit(){
 const pct=UN.ok/UN.steps.length,st=enSt();
 if(!st[UN.u.id])st[UN.u.id]={crowns:0};
 let g=false;
 if(UN.hearts>0&&pct>=0.8&&st[UN.u.id].crowns<3){st[UN.u.id].crowns++;g=true;}
 touchDay().enDone=true;prof().coins+=Math.round(pct*18);prof().xp+=Math.round(pct*28);touchDay().games++;save();
 if(g){sWIN();confetti(32);}
 render(topbar("screenAcademy()")
 +'<div class="card endcard"><div class="big">'+(UN.hearts<=0?"💔":g?"👑":"💪")+'</div>'
 +'<h2>'+UN.ok+' de '+UN.steps.length+'</h2>'
 +(UN.hearts<=0?'<p style="font-size:1.05rem;margin:6px 0 12px">Te quedaste sin corazones. ¡Inténtalo otra vez!</p>'
   :g?'<p style="font-size:1.15rem;margin:6px 0 12px">¡Ganaste una corona! '+"👑".repeat(st[UN.u.id].crowns)+'</p>'
   :'<p class="mut" style="margin:6px 0 12px">Logra 8/10 sin perder los corazones para ganar 👑</p>')
 +'<button class="kbtn red" onclick="startUnit(\''+UN.u.id+'\')">Repetir 🔁</button>'
 +'<button class="kbtn green" onclick="screenAcademy()">Ver unidades 🌐</button></div>');}

let RB={};
function gameRobot(startLvl){setTheme("kid");RB={lvl:startLvl,cmds:[],wins:0};renderRobot();}
function renderRobot(){
 const L=ROBOT_LEVELS[RB.lvl%ROBOT_LEVELS.length];
 let cells="";
 for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
  let c="";
  if(x===L.start[0]&&y===L.start[1])c="🤖";
  else if(x===L.goal[0]&&y===L.goal[1])c="⭐";
  else if(L.walls.some(w=>w[0]===x&&w[1]===y))c="🪨";
  cells+='<div class="cell" id="c'+x+'_'+y+'">'+c+'</div>';}
 render(topbar("screenKidMap()")
 +'<h2 style="font-size:1.4rem">🤖 Programa al robot</h2>'
 +'<p style="margin:4px 0 8px;font-size:1.05rem">Llévalo a la ⭐ — Pista: '+L.hint+'</p>'
 +'<div class="robotgrid" style="grid-template-columns:repeat('+L.w+',1fr)">'+cells+'</div>'
 +'<div class="cmdrow" id="cmdrow"></div>'
 +'<div class="cmdbtns"><button onclick="addCmd(0)">⬆️</button><button onclick="addCmd(1)">⬇️</button><button onclick="addCmd(2)">⬅️</button><button onclick="addCmd(3)">➡️</button></div>'
 +'<button class="kbtn green" onclick="runRobot()">▶️ ¡EJECUTAR!</button>'
 +'<button class="kbtn white" onclick="RB.cmds=[];drawCmds()">🧽 Borrar programa</button>');
 drawCmds();}
const ARROWS=["⬆️","⬇️","⬅️","➡️"];
function addCmd(i){if(RB.cmds.length<12){RB.cmds.push(i);beep([500+i*60],.08);drawCmds();}}
function drawCmds(){document.getElementById("cmdrow").innerHTML=RB.cmds.map(c=>'<span class="cmd">'+ARROWS[c]+'</span>').join("")||'<span style="opacity:.5;font-size:1rem;padding:8px">Toca las flechas para armar tu programa…</span>';}
function runRobot(){
 const L=ROBOT_LEVELS[RB.lvl%ROBOT_LEVELS.length];
 let[x,y]=L.start.slice();let i=0;
 const step=()=>{
  if(i>=RB.cmds.length)return finish();
  const c=RB.cmds[i++];
  const nx=x+(c===3?1:c===2?-1:0),ny=y+(c===1?1:c===0?-1:0);
  if(nx<0||ny<0||nx>=L.w||ny>=L.h||L.walls.some(w=>w[0]===nx&&w[1]===ny)){
   sNO();toast("💥 ¡Chocó! Revisa los pasos",false,1500);recordAnswer("Robot",false,25);
   setTimeout(renderRobot,1400);return;}
  document.getElementById("c"+x+"_"+y).textContent=(x===L.goal[0]&&y===L.goal[1])?"⭐":"";
  x=nx;y=ny;document.getElementById("c"+x+"_"+y).textContent="🤖";beep([400],.06);
  setTimeout(step,360);};
 const finish=()=>{
  const win=(x===L.goal[0]&&y===L.goal[1]);recordAnswer("Robot",win,25);
  if(win){RB.wins++;sWIN();confetti(16);
   if(RB.wins>=2)return nodeWin(3,"Robot");
   toast("¡Llegó! 🎉 Uno más…",true,1300);
   setTimeout(()=>{RB.lvl++;RB.cmds=[];renderRobot();},1400);}
  else{sNO();toast("No llegó a la ⭐ — ¡ajusta el programa!",false,1500);}};
 step();}

async function geminiJSON(promptText){
 const models=["gemini-2.0-flash","gemini-1.5-flash-latest","gemini-1.5-flash"];
 let res=null;
 for(const m of models){
  res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+m+":generateContent?key="+encodeURIComponent(S.geminiKey),
   {method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({contents:[{parts:[{text:promptText}]}],generationConfig:{temperature:0.9}})});
  if(res.ok)break;if(res.status!==404)break;}
 if(!res||!res.ok)throw new Error("Error de la API ("+(res?res.status:"red")+"). Revisa la clave en el panel de padres.");
 const data=await res.json();
 let txt=(data.candidates&&data.candidates[0].content.parts.map(p=>p.text||"").join(""))||"";
 txt=txt.replace(/```json|```/g,"").trim();
 const a=txt.indexOf("{"),b=txt.lastIndexOf("}");
 return JSON.parse(txt.slice(a,b+1));}

 return '<div class="card"><h3>🌐 Inglés: '+cr+' coronas 👑</h3><p class="mut" style="margin:6px 0 0">De '+(11*3)+' posibles en la Academia</p></div>'
 +'<div class="card"><h3>📝 Preparación del examen</h3>'
 +'<p class="mut" style="margin:8px 0 12px">Dominado = 80% o más. Hoy estudió <b>'+gd.length+'</b> tema(s).</p>'
 +'<div style="height:12px;border-radius:999px;background:#E2E8F0;overflow:hidden;margin-bottom:12px"><div style="height:100%;width:'+Math.round(m/Math.max(1,t)*100)+'%;background:linear-gradient(90deg,#7C3AED,#DB2777)"></div></div>'
 +'<p style="font-weight:800;margin-bottom:8px">'+m+' de '+t+' temas dominados</p>'
 +'<table><tr><th>Tema</th><th>Mejor</th><th>Intentos</th></tr>'+rows+'</table></div>';}
function screenTopicsMgr(){setTheme("parent");
 const ts=S.customTopics||[];
 render('<div class="topbar"><button class="back" onclick="screenParentDash()">←</button><b style="font-size:1.1rem">Mis temas</b></div>'
 +'<div class="card"><h3>🎯 Temas personalizados</h3>'
 +'<p class="mut" style="margin:8px 0 12px">Crea cualquier tema y la IA generará preguntas infinitas sobre él. Requiere clave de Gemini.</p>'
 +'<input type="text" id="tname" placeholder="Nombre (ej: Los planetas)">'
 +'<input type="text" id="temoji" placeholder="Emoji (ej: 🪐)" maxlength="4">'
 +'<input type="text" id="tprompt" placeholder="Qué debe preguntar (ej: los planetas del sistema solar, sus nombres y orden)">'
 +'<button class="pbtn" onclick="addTopic()">+ Agregar tema</button></div>'
 +'<div class="card"><h3>Temas creados ('+ts.length+')</h3>'
 +(ts.length?ts.map((t,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--par-line)"><span style="font-size:1.5rem">'+(t.emoji||"🎯")+'</span><span style="flex:1"><b>'+esc(t.name)+'</b><br><span class="mut" style="font-size:.82rem">'+esc(t.prompt).slice(0,70)+'…</span></span><button class="pbtn danger" style="padding:6px 12px" onclick="delTopic('+i+')">✕</button></div>').join(""):'<p class="mut">Ninguno todavía</p>')+'</div>'
 +'<div class="card"><h3>📺 Videos educativos</h3>'
 +'<p class="mut" style="margin:8px 0 12px">Pega enlaces de YouTube que tú apruebes. La IA creará preguntas de comprensión.</p>'
 +'<input type="text" id="vtitle" placeholder="Título (ej: Las capas de la Tierra)">'
 +'<input type="text" id="vurl" placeholder="https://youtube.com/watch?v=...">'
 +'<button class="pbtn" onclick="addVideo()">+ Agregar video</button>'
 +((S.videos||[]).length?'<div style="margin-top:12px">'+S.videos.map((v,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--par-line)"><span style="flex:1">▶️ '+esc(v.title)+'</span><button class="pbtn danger" style="padding:6px 12px" onclick="delVideo('+i+')">✕</button></div>').join("")+'</div>':'')
 +'</div>');}
function addTopic(){
 const n=document.getElementById("tname").value.trim(),e=document.getElementById("temoji").value.trim(),p=document.getElementById("tprompt").value.trim();
 if(!n||!p)return alert("Escribe al menos el nombre y qué debe preguntar");
 if(!S.customTopics)S.customTopics=[];
 S.customTopics.push({name:n,emoji:e||"🎯",prompt:p});save();registerCustomTopics();screenTopicsMgr();}
function delTopic(i){if(confirm("¿Borrar este tema?")){S.customTopics.splice(i,1);save();registerCustomTopics();screenTopicsMgr();}}
function addVideo(){
 const t=document.getElementById("vtitle").value.trim(),u=document.getElementById("vurl").value.trim();
 if(!t||!u)return alert("Escribe título y enlace");
 if(!ytId(u))return alert("El enlace no parece de YouTube");
 if(!S.videos)S.videos=[];S.videos.push({title:t,url:u});save();screenTopicsMgr();}
function delVideo(i){if(confirm("¿Borrar este video?")){S.videos.splice(i,1);save();screenTopicsMgr();}}
function ytId(u){const m=String(u).match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);return m?m[1]:null;}
/* mundo videos y temas propios */
function screenVideos(){setTheme("kid");
 const vids=S.videos||[];
 if(!vids.length)return render(topbar("screenKidMap()")+'<div class="card center"><div style="font-size:3rem">📺</div><h2 style="margin:8px 0">Aún no hay videos</h2><p style="font-size:1rem">Papá o mamá pueden agregarlos desde el panel de padres.</p><button class="kbtn green" style="margin-top:12px" onclick="screenKidMap()">Volver</button></div>');
 render(topbar("screenKidMap()")+'<h2 style="font-size:clamp(1.3rem,6vw,1.6rem);text-align:center;margin-bottom:10px">📺 Videos para aprender</h2>'
 +vids.map((v,i)=>'<button class="kbtn blue" onclick="openVideo('+i+')">▶️ '+esc(v.title)+'</button>').join(""));}
function openVideo(i){
 const v=S.videos[i],id=ytId(v.url);
 render(topbar("screenVideos()")+'<h2 style="font-size:clamp(1.15rem,5vw,1.4rem);margin-bottom:10px">▶️ '+esc(v.title)+'</h2>'
 +(id?'<div style="position:relative;padding-top:56.25%;border-radius:20px;overflow:hidden;border:4px solid var(--kid-ink);box-shadow:0 6px 0 rgba(30,42,74,.8)"><iframe src="https://www.youtube-nocookie.com/embed/'+id+'" style="position:absolute;inset:0;width:100%;height:100%;border:0" allowfullscreen></iframe></div>':'<div class="card">Enlace inválido</div>')
 +'<div style="height:14px"></div>'
 +(S.geminiKey?'<button class="kbtn green" onclick="videoQuiz('+i+')">🧠 Preguntas del video</button>':'<p class="audiotip">💡 Con la clave de Gemini aparecen preguntas de comprensión.</p>'));}
async function videoQuiz(i){
 const v=S.videos[i];
 render(topbar("screenVideos()")+'<div class="card center" style="padding:40px"><div class="spin" style="font-size:3rem">⏳</div><h2 style="margin-top:10px">Creando preguntas…</h2></div>');
 try{const o=await geminiJSON('Un niño de 7 años vio un video educativo titulado "'+v.title+'". Crea 4 preguntas de comprensión sencillas sobre ese TEMA. SOLO JSON: {"items":[{"q":"pregunta","ops":["correcta","mala","mala"],"a":0}]}');
  const items=o.items.map(it=>{const c=it.ops[it.a],ops=shuffled(it.ops);return{q:it.q,ops,a:ops.indexOf(c),_topic:null};});
  CH={label:"Video",items,i:0,ok:0,wrongTopics:{}};curNode="videos";renderCH();
 }catch(e){toast("No se pudieron crear",false,1800);screenVideos();}}
function screenCustomPick(){setTheme("kid");
 const ts=S.customTopics||[];
 render(topbar("screenKidMap()")+'<h2 style="font-size:clamp(1.3rem,6vw,1.6rem);text-align:center;margin-bottom:10px">🎯 Mis temas</h2>'
 +ts.map((t,i)=>'<button class="kbtn purple" onclick="playCustom('+i+')">'+(t.emoji||"🎯")+' '+esc(t.name)+'</button>').join("")
 +(S.geminiKey?'':'<p class="audiotip">⚠️ Necesita la clave de Gemini (panel de padres).</p>'));}
function playCustom(i){
 if(!S.geminiKey)return toast("Necesita la clave de Gemini",false,2200);
 curNode="mistemas";registerCustomTopics();
 playTopics(S.customTopics[i].name,["custom_"+i],{perTopic:8,total:8});}

function saveSettings(){
 S.geminiKey=document.getElementById("gkey").value.trim();
 const em=document.getElementById("exmode");if(em)S.examMode=em.checked;
 const dg=document.getElementById("dgoal");if(dg)S.kidCfg.dailyGoal=Math.max(1,Math.min(12,+dg.value||3));
 const mn=document.getElementById("maxn");if(mn)S.kidCfg.maxN=Math.max(10,Math.min(999,+mn.value||20));
 const rt=document.getElementById("rtime");if(rt&&rt.value)remCfg().time=rt.value;
 const ro=document.getElementById("ron");if(ro)remCfg().on=ro.checked;
 const np=document.getElementById("newpin").value.trim();if(np)S.pin=np;
 S.profiles.nino.name=document.getElementById("nName").value.trim()||"Explorador";
 S.profiles.nina.name=document.getElementById("aName").value.trim()||"Estrella";
 save();document.getElementById("fb").innerHTML=' <b style="color:var(--par-acc)">✓ Guardado</b>';}
function exportData(){
 const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="academia-respaldo-"+todayStr()+".json";a.click();}
function importData(ev){
 const f=ev.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=()=>{try{const base=JSON.parse(JSON.stringify(DEFAULT_STATE));deepMerge(base,JSON.parse(r.result));S=base;save();screenParentDash();}catch(e){alert("Archivo no válido");}};
 r.readAsText(f);}


/* ===== PWA: cache offline ===== */
if("serviceWorker"in navigator){
 const swCode=`self.addEventListener("install",e=>{self.skipWaiting()});
self.addEventListener("activate",e=>{e.waitUntil(self.clients.claim())});
self.addEventListener("fetch",e=>{
 if(e.request.method!=="GET")return;
 const u=new URL(e.request.url);
 if(u.origin!==location.origin)return;
 e.respondWith(
  fetch(e.request).then(r=>{const c=r.clone();caches.open("acad-v1").then(x=>x.put(e.request,c));return r})
   .catch(()=>caches.match(e.request))
 )});`;
 try{
  const blob=new Blob([swCode],{type:"text/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
 }catch(e){}
}
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;});
function installApp(){
 if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;}
 else alert("Para instalar: menú ⋮ del navegador → 'Instalar aplicación' o 'Agregar a pantalla de inicio'");}


/* ============ RECORDATORIOS ============ */
function remCfg(){if(!S.remind)S.remind={on:false,time:"17:00",last:""};return S.remind;}
function askNotif(){
 if(!("Notification"in window)){alert("Este navegador no soporta notificaciones. Usa la alarma del celular.");return;}
 Notification.requestPermission().then(p=>{
  if(p==="granted"){remCfg().on=true;save();toast("✅ Recordatorio activado",true,1600);
   try{new Notification("Academia Familiar",{body:"¡Listo! Te avisaré cada día 🚀"});}catch(e){}
   if(typeof screenParentDash==="function"&&current.profile===null)screenParentDash();}
  else alert("No diste permiso. Actívalo en los ajustes del navegador.");});}
function checkRemind(){
 const r=remCfg();if(!r.on)return;
 const now=new Date(),t=todayStr();
 const [hh,mm]=(r.time||"17:00").split(":").map(Number);
 if(r.last===t)return;
 if(now.getHours()>hh||(now.getHours()===hh&&now.getMinutes()>=mm)){
  r.last=t;save();
  const kid=S.profiles.nino,d=kid.days[t];
  const pend=!d||d.games<2;
  try{if(Notification.permission==="granted")
   new Notification("🚀 ¡Tu misión de hoy!",{body:pend?"Aún no terminas tus misiones. ¡Vamos a estudiar!":"¡Buen trabajo hoy! Sigue así 🌟"});}catch(e){}
 }}
setInterval(checkRemind,60000);

/* ============ ARRANQUE ============ */
registerCustomTopics();
screenStart();
</script>
